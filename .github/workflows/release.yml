name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Foundry package
        shell: bash
        run: |
          mkdir -p dist/swipe-symbaroum
          cp module.json README.md LICENSE dist/swipe-symbaroum/
          cp -R lang scripts styles dist/swipe-symbaroum/
          cp module.json dist/module.json
          cd dist
          zip -r swipe-symbaroum.zip swipe-symbaroum

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/module.json
            dist/swipe-symbaroum.zip
          generate_release_notes: true
